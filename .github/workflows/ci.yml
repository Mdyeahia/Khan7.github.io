
name: HTML Website CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Validate HTML Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check index.html exists
        run: test -f index.html

      - name: Check CSS directory exists
        run: test -d css

      - name: Prepare deployment package
        run: |
          mkdir -p publish
          cp -r *.html css images publish/ 2>/dev/null || true

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-website
          path: publish/
